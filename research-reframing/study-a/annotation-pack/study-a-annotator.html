<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study A 标注</title>
<style>
  :root {
    --bg: #f3eee6;
    --bg-deep: #e7e0d4;
    --card: #fffdf9;
    --ink: #1c1915;
    --muted: #5c564c;
    --faint: #8a8174;
    --line: #e4dacb;
    --accent: #0e5c4c;
    --accent-ink: #084237;
    --accent-soft: #e4f3ee;
    --copper: #8d4b22;
    --copper-soft: #f8ece4;
    --danger: #8d2c2c;
    --danger-soft: #fdeeee;
    --shadow: 0 16px 40px rgba(70, 48, 22, 0.07);
    --radius: 18px;
    --sans: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", "Source Code Pro", "Noto Sans Mono CJK SC", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(1200px 500px at 10% -10%, #fff 0%, transparent 55%),
      linear-gradient(180deg, #f7f3ec 0%, var(--bg) 40%, #efe8dc 100%);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  code, .mono { font-family: var(--mono); font-size: 0.92em; }
  .hidden { display: none !important; }
  .gate {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 18px;
  }
  .gate-card {
    width: min(880px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 36px 36px 28px;
  }
  .kicker {
    margin: 0 0 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
  }
  h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -0.03em; line-height: 1.2; }
  .lede { margin: 0 0 22px; color: var(--muted); font-size: 16.5px; }
  .people { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .person {
    text-align: left;
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 16px;
    padding: 16px 16px 14px;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .person:hover { border-color: #b7d4cb; }
  .person.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .person .who { display: block; color: var(--accent); font-size: 13px; font-weight: 700; }
  .person strong { display: block; font-size: 22px; margin: 2px 0 6px; }
  .person .sub { display: block; color: var(--muted); font-size: 13px; min-height: 1.3em; }
  .rules {
    margin: 18px 0;
    padding: 14px 16px;
    background: #faf7f2;
    border-radius: 14px;
    color: var(--muted);
  }
  .rules ul { margin: 8px 0 0; padding-left: 1.2em; }
  .rules li + li { margin-top: 4px; }
  .gate-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn {
    border: 0;
    border-radius: 999px;
    padding: 11px 18px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.copper { background: var(--copper); }
  .btn.ghost { background: transparent; color: var(--muted); border: 0; padding-inline: 10px; }
  .btn.small { padding: 7px 12px; font-size: 14px; font-weight: 650; }
  .file-btn { position: relative; overflow: hidden; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  header.app-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: minmax(180px, 240px) 1fr auto;
    gap: 16px;
    align-items: center;
    padding: 12px 18px;
    background: rgba(255, 252, 247, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .mark {
    width: 36px; height: 36px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--accent); color: #fff; font-weight: 800;
    flex: none;
  }
  .brand .name { font-weight: 800; letter-spacing: -0.02em; }
  .brand .meta { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress-wrap { min-width: 0; }
  .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 8px; background: var(--bg-deep); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #2a9a7a); border-radius: inherit; transition: width .25s ease; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .save-line { font-size: 12.5px; color: var(--faint); padding: 0 2px; }
  .layout { display: grid; grid-template-columns: 232px 1fr; gap: 18px; width: min(1180px, calc(100% - 28px)); margin: 18px auto 40px; }
  nav.rail {
    position: sticky; top: 86px; align-self: start;
    display: flex; flex-direction: column; gap: 6px;
    max-height: calc(100vh - 110px); overflow: auto;
    padding-right: 4px;
  }
  .nav-btn {
    display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center;
    text-align: left; border: 1px solid transparent; background: transparent;
    border-radius: 12px; padding: 8px 10px; color: var(--muted);
  }
  .nav-btn .sid { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ink); }
  .nav-btn.current { background: #fff; border-color: var(--line); color: var(--ink); box-shadow: 0 4px 16px rgba(70, 48, 22, 0.05); }
  .dot { width: 9px; height: 9px; border-radius: 99px; border: 1.5px solid #c3b8a8; }
  .nav-btn.partial .dot { background: #e0b15a; border-color: #e0b15a; }
  .nav-btn.done .dot { background: var(--accent); border-color: var(--accent); }
  main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px 18px;
  }
  .card h2 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.03em; }
  .card h3 { margin: 0 0 10px; font-size: 18px; }
  .eyebrow { margin: 0; color: var(--accent); font-weight: 700; font-size: 13px; }
  .en { margin: 0; white-space: pre-wrap; }
  pre.en, pre.zh {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
  }
  .zh-box {
    margin-top: 12px; padding: 12px 14px; border-radius: 12px;
    background: #f7f4ee; border: 1px dashed #e0d5c6;
  }
  .tag { display: inline-block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--copper); }
  .fine { margin: 8px 0 0; color: var(--faint); font-size: 13px; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .key {
    background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 999px; padding: 3px 10px; font-size: 13px;
  }
  .checks { display: grid; gap: 8px; }
  .checks p { margin: 0; }
  .field { margin-top: 16px; scroll-margin-top: 96px; }
  #file-bar {
    width: min(1180px, calc(100% - 28px));
    margin: 12px auto 0;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    color: var(--muted);
    font-size: 13.5px;
  }
  #live-downloads { display: flex; gap: 8px; flex-wrap: wrap; }
  #live-downloads a {
    text-decoration: none;
    color: var(--accent-ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-weight: 750;
  }
  .field label.lbl, .legend {
    display: block; font-weight: 750; margin-bottom: 4px;
  }
  .help { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  .example {
    margin: 8px 0 0; color: var(--faint); font-size: 13px;
  }
  .example code { color: var(--ink); background: #f3eee6; padding: 1px 6px; border-radius: 6px; }
  .choices { display: grid; gap: 8px; }
  .choice {
    display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff;
  }
  .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .choice b { font-family: var(--mono); font-size: 14px; }
  .choice small { display: block; color: var(--muted); font-weight: 450; }
  .yn { display: flex; gap: 8px; }
  .yn label {
    flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    background: #fff; display: flex; gap: 8px; align-items: center;
  }
  .yn label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  textarea, input[type="text"] {
    width: 100%; border: 1px solid #ddd3c4; border-radius: 12px;
    padding: 10px 12px; background: #fff; resize: vertical;
  }
  textarea { min-height: 84px; }
  textarea:focus, input[type="text"]:focus, .choice:focus-within, .yn label:focus-within {
    outline: 2px solid #9dcec2; outline-offset: 1px;
  }
  .field.invalid textarea, .field.invalid input[type="text"], .field.invalid .choices, .field.invalid .yn {
    box-shadow: inset 0 0 0 1px var(--danger);
  }
  .err { color: var(--danger); font-size: 13.5px; margin: 6px 0 0; }
  .error-box {
    border: 1px solid #f0c8c8; background: var(--danger-soft); color: #6d2424;
    border-radius: 14px; padding: 12px 14px;
  }
  .error-box ul { margin: 8px 0 0; padding-left: 1.2em; }
  .q-en { margin: 0; font-size: 17px; }
  .q-zh { margin: 6px 0 0; color: var(--muted); }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .footer-nav {
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    position: sticky; bottom: 12px;
  }
  .footer-nav .card { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; width: 100%; }
  .overview table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .overview th, .overview td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .overview button.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 750; }
  .modal-back {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(40, 30, 18, 0.35);
    display: grid; place-items: center; padding: 18px;
  }
  .modal {
    width: min(560px, 100%); background: #fff; border-radius: 20px;
    padding: 22px; box-shadow: var(--shadow);
  }
  .modal h3 { margin: 0 0 8px; font-size: 22px; }
  .modal p { margin: 0 0 10px; color: var(--muted); }
  .modal .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .dl-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .dl-list a {
    display: block; text-decoration: none; color: var(--accent-ink); font-weight: 700;
    background: var(--accent-soft); border-radius: 12px; padding: 10px 12px;
  }
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; border-radius: 999px;
    padding: 10px 14px; z-index: 50; max-width: min(520px, calc(100% - 24px));
    font-size: 14px;
  }
  .skip-note { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 860px) {
    .gate-card { padding: 22px 16px; }
    h1 { font-size: 28px; }
    .people { grid-template-columns: 1fr; }
    header.app-bar { grid-template-columns: 1fr; }
    .layout { grid-template-columns: 1fr; width: min(100% - 16px, 1180px); }
    nav.rail {
      position: sticky; top: 0; max-height: none; flex-direction: row;
      overflow: auto; background: rgba(243, 238, 230, 0.95); padding: 8px 0; z-index: 15;
    }
    .nav-btn { min-width: max-content; }
    .nav-btn .slabel { display: none; }
    #file-bar { flex-direction: column; align-items: flex-start; width: min(100% - 16px, 1180px); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <p class="kicker">Study A · 双人独立标注</p>
      <h1>只打开这一个文件</h1>
      <p class="lede">十五道题都在这一页里。先选择你是哪一位标注员。两人题目相同，答案分开保存。不需要打开 Markdown 或 CSV。</p>
      <div class="people" role="radiogroup" aria-label="选择标注员">
        <button type="button" class="person" data-pick="A" id="pick-A">
          <span class="who">标注员 A</span>
          <strong>Xujun Ye</strong>
          <span class="sub" id="stat-A">本机还没有草稿</span>
        </button>
        <button type="button" class="person" data-pick="B" id="pick-B">
          <span class="who">标注员 B</span>
          <strong>Jinlin Zhang</strong>
          <span class="sub" id="stat-B">本机还没有草稿</span>
        </button>
      </div>
      <div class="rules">
        <strong>填写前</strong>
        <ul>
          <li>只根据每题页面上的「需求」和「非正式说明」作答。中文译文只帮助阅读；和英文不一致时，以英文为准。</li>
          <li>候选问题只指出要决定什么，不是答案。虚构班车的例句只示范格式，不要照抄。</li>
          <li>一个人只填自己的那一份。不要和另一位讨论，也不要看对方的答案。</li>
          <li>不要打开本文件以外的材料。填完十五题后点「导出并锁定」，把下载的两个文件交给协调人。</li>
        </ul>
      </div>
      <div class="gate-actions">
        <button type="button" class="btn" id="start-btn" disabled>开始填写</button>
        <label class="btn secondary file-btn">导入 JSON<input id="import-gate" type="file" accept="application/json,.json"></label>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="app-bar">
      <div class="brand">
        <div class="mark" id="mark">A</div>
        <div>
          <div class="name" id="brand-name">标注员 A</div>
          <div class="meta" id="brand-meta">Xujun Ye</div>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span id="progress-text">已完成 0/15</span><span id="save-text">尚未写入</span></div>
        <div class="bar" aria-hidden="true"><span id="progress-bar"></span></div>
      </div>
      <div class="actions">
        <button type="button" class="btn secondary small" id="overview-btn">总览</button>
        <button type="button" class="btn secondary small" id="bind-btn">绑定文件夹</button>
        <button type="button" class="btn secondary small" id="save-btn">保存并下载</button>
        <button type="button" class="btn copper small" id="lock-btn">导出并锁定</button>
      </div>
    </header>
    <div class="layout">
      <nav class="rail" id="nav" aria-label="场景"></nav>
      <main id="main"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="hidden" role="status"></div>
  <script>
const SCENARIOS = [{"id":"S01","nav":"共享办公室","nl":"A member books a desk for one day in a shared office. The source text does not say whether that member may bring another person into the office that day.","nlZh":"会员预订共享办公室里的一张桌子，使用一天。原文没有说，这一天这位会员能不能再带一个人进办公室。","informal":"# Functions\n\n## Book a desk\n\nA member books a desk for one day. Whether another person may enter the office that day is not stated.\n\n# Data Resources\n\n## Booking\n\nThe booking records the member, the desk, and the day.\n\n# Constraints\n\n## One desk\n\nA desk has one booking for a given day.","informalZh":"# 功能\n\n## 预订桌子\n\n会员预订一张桌子，使用一天。这一天能不能有另一个人进入办公室，原文没有写。\n\n# 数据资源\n\n## 预订\n\n预订记录会员、桌子和日期。\n\n# 约束\n\n## 一张桌子一天一条预订\n\n某一天，一张桌子只有一条预订。","slots":[{"id":"day-visitor","en":"May a member bring another person into the shared office on a booked day?","zh":"会员在已预订的那一天，能不能带另一个人进入共享办公室？"}]},{"id":"S02","nav":"相机租赁","nl":"A customer borrows a camera from a rental desk for a weekend and returns it on Monday. The source text does not say whether the desk collects money up front against damage.","nlZh":"顾客从租赁台借一台相机过周末，周一归还。原文没有说，租赁台会不会在借出时先收一笔钱，用来应对损坏。","informal":"# Functions\n\n## Check out a camera\n\nA customer borrows a camera for a weekend. Whether the desk collects money up front against damage is not stated.\n\n# Data Resources\n\n## Rental\n\nThe rental records the camera, the customer, and the return day.\n\n# Constraints\n\n## Return day\n\nThe camera is due back on Monday.","informalZh":"# 功能\n\n## 借出相机\n\n顾客借一台相机过周末。租赁台会不会在借出时先收一笔钱用来应对损坏，原文没有写。\n\n# 数据资源\n\n## 租赁\n\n租赁记录相机、顾客和归还日。\n\n# 约束\n\n## 归还日\n\n相机应在周一归还。","slots":[{"id":"upfront-hold","en":"Does the rental desk collect money up front against damage when the camera goes out?","zh":"相机借出时，租赁台会不会先收一笔钱，用来应对损坏？"}]},{"id":"S03","nav":"网球场预订","nl":"Members book a tennis court up to 7 days ahead today. Change new bookings so they can be made up to 14 days ahead. The source text does not say what happens to a booking that was placed under the old limit.","nlZh":"会员现在最多可以提前 7 天预订网球场。请把新的预订改成最多可以提前 14 天。原文没有说，已经按旧的 7 天限额订下去的那场预订怎么办。","informal":"# Functions\n\n## Place a booking\n\nA member places a court booking. New bookings may be made up to 14 days ahead. Today the limit is 7 days.\n\n## Charge a no-show\n\nA member who misses a booked court is charged a no-show fee. This change does not alter that fee.\n\n# Data Resources\n\n## Member\n\nThe member records the membership number and the name.\n\n# Constraints\n\n## New advance window\n\nA new booking may be placed up to 14 days ahead. The source text does not say what happens to a booking that was placed under the old limit.","informalZh":"# 功能\n\n## 下预订\n\n会员预订球场。新的预订最多可以提前 14 天。现在的限额是提前 7 天。\n\n## 收取缺席费\n\n会员缺席已预订的球场时，要交缺席费。这次改动不改变这笔费用。\n\n# 数据资源\n\n## 会员\n\n会员记录会员号和姓名。\n\n# 约束\n\n## 新的可提前天数\n\n新的预订最多可以提前 14 天。已经按旧限额订下去的那场预订怎么办，原文没有写。","slots":[{"id":"placed-booking","en":"What happens to a booking that was placed under the 7-day limit?","zh":"已经按 7 天限额订下去的那场预订，会怎么样？"}]},{"id":"S04","nav":"回收投放","nl":"The drop-off charge for one carload of mixed recyclables is 5 dollars today. Change that charge to 8 dollars for carloads that arrive after the change date. The source text does not say what happens to a punch card that was sold before the change.","nlZh":"混合可回收物，一车的投放费今天是 5 美元。请把变更日之后到达的车次改成收费 8 美元。原文没有说，变更之前已经卖掉的次卡怎么办。","informal":"# Functions\n\n## Accept a carload\n\nThe site accepts one carload of mixed recyclables. Carloads that arrive after the change date pay 8 dollars. Today the charge is 5 dollars.\n\n## Publish hours\n\nThe site publishes its open hours. This change does not alter the hours.\n\n# Data Resources\n\n## Site\n\nThe site records the address and the open hours.\n\n# Constraints\n\n## New carload charge\n\nA carload that arrives after the change date pays 8 dollars. The source text does not say what happens to a punch card that was sold before the change.","informalZh":"# 功能\n\n## 接收一车\n\n站点接收一车混合可回收物。变更日之后到达的车次付 8 美元。今天的收费是 5 美元。\n\n## 公布开放时间\n\n站点公布开放时间。这次改动不改变开放时间。\n\n# 数据资源\n\n## 站点\n\n站点记录地址和开放时间。\n\n# 约束\n\n## 新的一车收费\n\n变更日之后到达的一车付 8 美元。变更前已经卖掉的次卡怎么办，原文没有写。","slots":[{"id":"punch-card","en":"What happens to a punch card that was sold before the charge change?","zh":"收费变更之前已经卖掉的次卡，会怎么样？"}]},{"id":"S05","nav":"宠物寄养","nl":"An owner leaves a pet at a kennel overnight and may leave a packet of medicine with the staff. The source text does not say whether the staff give that medicine.","nlZh":"主人把宠物留在寄养处过夜，也可以把一包药留给工作人员。原文没有说，工作人员会不会喂这包药。","informal":"# Functions\n\n## Board a pet\n\nAn owner leaves a pet overnight. A packet of medicine may be left with the staff. Whether the staff give that medicine is not stated.\n\n# Data Resources\n\n## Stay\n\nThe stay records the pet, the owner, and the night.\n\n# Constraints\n\n## Recorded stay\n\nA boarded pet has one open stay.","informalZh":"# 功能\n\n## 寄养宠物\n\n主人把宠物留下过夜。可以把一包药留给工作人员。工作人员会不会喂这包药，原文没有写。\n\n# 数据资源\n\n## 寄养\n\n寄养记录宠物、主人和过夜日期。\n\n# 约束\n\n## 已登记的寄养\n\n一只在寄养的宠物只有一条未结束的寄养记录。","slots":[{"id":"give-medicine","en":"Do kennel staff give medicine that the owner left with them?","zh":"寄养处的工作人员会不会喂主人留下的药？"}]},{"id":"S06","nav":"洗车套餐","nl":"A monthly wash plan costs 20 dollars today. Change the plan price to 25 dollars for renewals after the change date. The source text does not say whether the month already on the books keeps its price.","nlZh":"月度洗车套餐今天是 20 美元。请把变更日之后的续费改成 25 美元。原文没有说，已经记在账上的那一个月是否还按原价。","informal":"# Functions\n\n## Renew a plan\n\nA member renews a monthly wash plan. Renewals after the change date cost 25 dollars. Today the plan costs 20 dollars.\n\n## Sell a single wash\n\nThe site sells one wash with no plan. This change does not alter the single-wash price.\n\n# Data Resources\n\n## Vehicle\n\nThe vehicle records the plate and the member.\n\n# Constraints\n\n## New plan price\n\nA renewal after the change date costs 25 dollars. The source text does not say whether the month already on the books keeps its price.","informalZh":"# 功能\n\n## 续费套餐\n\n会员续费月度洗车套餐。变更日之后的续费是 25 美元。今天的套餐价格是 20 美元。\n\n## 出售单次洗车\n\n站点出售不加入套餐的单次洗车。这次改动不改变单次洗车的价格。\n\n# 数据资源\n\n## 车辆\n\n车辆记录车牌和会员。\n\n# 约束\n\n## 新的套餐价格\n\n变更日之后的续费是 25 美元。已经记在账上的那一个月是否保持原价，原文没有写。","slots":[{"id":"paid-month","en":"Does the month already on the books keep the price that was in force when it started?","zh":"已经记在账上的那一个月，是否保持它开始时的价格？"}]},{"id":"S07","nav":"花园地块","nl":"A member of a community garden may pass a plot to another member. The source text does not say whether the garden association has to agree before the plot changes hands.","nlZh":"社区花园的会员可以把一块地转给另一位会员。原文没有说，地块转手之前，花园协会是否必须同意。","informal":"# Functions\n\n## Pass a plot\n\nA member passes a plot to another member. Whether the garden association has to agree is not stated.\n\n# Data Resources\n\n## Plot\n\nThe plot records the bed number and the current member.\n\n# Constraints\n\n## One holder\n\nA plot has one current member.","informalZh":"# 功能\n\n## 转让地块\n\n会员把一块地转给另一位会员。花园协会是否必须同意，原文没有写。\n\n# 数据资源\n\n## 地块\n\n地块记录畦号和当前会员。\n\n# 约束\n\n## 一个持有人\n\n一块地只有一位当前会员。","slots":[{"id":"transfer-consent","en":"Does a plot change hands only after the garden association agrees?","zh":"是不是必须等花园协会同意，地块才能转手？"}]},{"id":"S08","nav":"共享单车","nl":"A rider ends a bike-share trip by docking the bicycle at a station. The source text does not say what the service does when the trip continues after the time the rider paid for.","nlZh":"骑行者把自行车停进站点，共享单车的这一次行程就结束。原文没有说，行程超过已经付费的时间之后，服务会怎么处理。","informal":"# Functions\n\n## End a trip\n\nA rider ends a trip by docking the bicycle at a station. What the service does after the paid time is not stated.\n\n# Data Resources\n\n## Trip\n\nThe trip records the bicycle, the rider, the start time, and the paid time.\n\n# Constraints\n\n## Docking\n\nA trip ends when the bicycle is docked at a station.","informalZh":"# 功能\n\n## 结束行程\n\n骑行者把自行车停进站点，行程结束。超过已付时间之后服务怎么处理，原文没有写。\n\n# 数据资源\n\n## 行程\n\n行程记录自行车、骑行者、开始时间和已付时间。\n\n# 约束\n\n## 入站即结束\n\n自行车停进站点时，行程结束。","slots":[{"id":"overtime-policy","en":"What does the service do when a trip continues after the paid time?","zh":"行程超过已付时间之后，服务会怎么做？"}]},{"id":"S09","nav":"旅舍床位","nl":"A guest reserves a bed for one night and names an arrival time. The source text does not say how long the hostel keeps that bed after the named arrival time.","nlZh":"客人预订一张床住一晚，并写下预计到达时间。原文没有说，过了这个到达时间之后，旅舍还会把这张床留多久。","informal":"# Functions\n\n## Reserve a bed\n\nA guest reserves a bed for one night and names an arrival time. How long the hostel keeps that bed after the named arrival time is not stated.\n\n# Data Resources\n\n## Reservation\n\nThe reservation records the guest, the bed, and the named arrival time.\n\n# Constraints\n\n## One night\n\nThe reservation covers one night.","informalZh":"# 功能\n\n## 预订床位\n\n客人预订一张床住一晚，并写下预计到达时间。过了这个时间之后床还会留多久，原文没有写。\n\n# 数据资源\n\n## 预订\n\n预订记录客人、床位和写下的到达时间。\n\n# 约束\n\n## 住一晚\n\n这次预订只覆盖一晚。","slots":[{"id":"hold-length","en":"How long does the hostel keep a reserved bed after the named arrival time?","zh":"过了客人写下的到达时间之后，旅舍还会把预订的床留多久？"}]},{"id":"S10","nav":"集市摊位","nl":"A vendor pays 40 dollars for one stall on a market Saturday, and the fee is due before the stall is set up. The amount and the due time are stated. No second stall fee is left open.","nlZh":"摊主在集市的某个周六为一个摊位支付 40 美元，费用在摆摊之前交清。金额和交费时间都已经写明。没有留下第二种摊位费。","informal":"# Functions\n\n## Assign a stall\n\nA vendor pays 40 dollars for one stall on a market Saturday. The fee is due before the stall is set up.\n\n# Data Resources\n\n## Stall\n\nThe stall records the vendor and the Saturday.\n\n# Constraints\n\n## Stated fee\n\nThe stall fee is 40 dollars, due before setup. This rule is fully stated.","informalZh":"# 功能\n\n## 分配摊位\n\n摊主为集市某个周六的一个摊位支付 40 美元。费用在摆摊之前交清。\n\n# 数据资源\n\n## 摊位\n\n摊位记录摊主和那个周六。\n\n# 约束\n\n## 已写明的费用\n\n摊位费是 40 美元，摆摊之前交清。这条规则已经完整写出。","slots":[]},{"id":"S11","nav":"博物馆入场","nl":"A museum member is admitted to the galleries. The source text does not say whether someone who arrives with that member is admitted on the same visit.","nlZh":"博物馆会员可以进入展厅。原文没有说，和这位会员一起来的人，在同一次参观中能不能进入。","informal":"# Functions\n\n## Admit a visitor\n\nThe desk admits a museum member to the galleries. Whether someone who arrives with that member is admitted on the same visit is not stated.\n\n# Data Resources\n\n## Member\n\nThe member records the membership number and the name.\n\n# Constraints\n\n## Member admission\n\nA current member is admitted to the galleries.","informalZh":"# 功能\n\n## 放行参观者\n\n服务台放会员进入展厅。和会员一起来的人在同一次参观中能不能进入，原文没有写。\n\n# 数据资源\n\n## 会员\n\n会员记录会员号和姓名。\n\n# 约束\n\n## 会员入场\n\n当前有效的会员可以进入展厅。","slots":[{"id":"accompanying-entry","en":"Does a person who arrives with a member get in on that member's visit?","zh":"和会员一起来的人，能不能在这次会员参观时一起进入？"}]},{"id":"S12","nav":"泳池场次","nl":"A non-member pays 8 dollars for one swim session at the municipal pool. A member swims during open hours with no session fee. Both rules are stated. No second fee is left open.","nlZh":"非会员在市立泳池游一次，付 8 美元。会员在开放时间内游泳，不收单次费用。两条规则都已经写明。没有留下第二种费用。","informal":"# Functions\n\n## Sell a session\n\nA non-member pays 8 dollars for one swim session. A member swims during open hours with no session fee.\n\n# Data Resources\n\n## Session\n\nThe session records the swimmer and the day.\n\n# Constraints\n\n## Stated fees\n\nThe non-member fee is 8 dollars for one session. The member session fee is zero. This rule is fully stated.","informalZh":"# 功能\n\n## 出售单次游泳\n\n非会员游一次付 8 美元。会员在开放时间内游泳，不收单次费用。\n\n# 数据资源\n\n## 场次\n\n场次记录游泳的人和日期。\n\n# 约束\n\n## 已写明的费用\n\n非会员单次费用是 8 美元。会员的单次费用是零。这条规则已经完整写出。","slots":[]},{"id":"S13","nav":"药房取药","nl":"A filled prescription waits at the pharmacy counter. The source text does not say who is allowed to take it away, and it does not say which proof the counter accepts.","nlZh":"配好的处方药在药房柜台等候领取。原文没有说谁可以把药取走，也没有说柜台接受哪种身份证明。","informal":"# Functions\n\n## Release a prescription\n\nThe counter releases a filled prescription. Who may take it away is not stated.\n\n## Check identity\n\nThe counter checks identity before the release. Which proof is accepted is not stated.\n\n# Data Resources\n\n## Prescription\n\nThe prescription records the patient name, the medicine, and the ready time.\n\n# Constraints\n\n## Ready status\n\nOnly a prescription marked ready may leave the counter.","informalZh":"# 功能\n\n## 发放处方药\n\n柜台发放已配好的处方药。谁可以把它取走，原文没有写。\n\n## 核对身份\n\n柜台在发放前核对身份。接受哪种证明，原文没有写。\n\n# 数据资源\n\n## 处方\n\n处方记录患者姓名、药品和配好的时间。\n\n# 约束\n\n## 已配好才能离开\n\n只有标记为已配好的处方药可以离开柜台。","slots":[{"id":"who-collects","en":"Who is allowed to take a filled prescription away from the counter?","zh":"谁可以把配好的处方药从柜台取走？"},{"id":"id-proof","en":"Which proof does the counter require before it releases the medicine?","zh":"柜台在把药发出去之前，要求看哪种证明？"}]},{"id":"S14","nav":"蛋糕预订","nl":"A cake preorder is accepted only when it is placed before 15:00 on the day before pickup. An order placed after 15:00 is refused. The cutoff time is stated. No second cutoff is left open.","nlZh":"蛋糕预订单只有在取货日前一天下午 15:00 之前下单才会接受。15:00 之后下的单会被拒绝。截止时间已经写明。没有留下第二种截止时间。","informal":"# Functions\n\n## Take a cake preorder\n\nA cake preorder is accepted only when it is placed before 15:00 on the day before pickup. An order placed after 15:00 is refused.\n\n# Data Resources\n\n## Preorder\n\nThe preorder records the cake, the customer, and the pickup day.\n\n# Constraints\n\n## Stated cutoff\n\nThe cutoff is 15:00 on the day before pickup. This rule is fully stated.","informalZh":"# 功能\n\n## 接受蛋糕预订\n\n蛋糕预订单只有在取货日前一天 15:00 之前下单才会接受。15:00 之后下的单会被拒绝。\n\n# 数据资源\n\n## 预订\n\n预订记录蛋糕、顾客和取货日。\n\n# 约束\n\n## 已写明的截止时间\n\n截止时间是取货日前一天的 15:00。这条规则已经完整写出。","slots":[]},{"id":"S15","nav":"献血接待","nl":"A donor gives blood at a donation center that also takes appointments. The source text does not say whether a donor who did not book is seen.","nlZh":"献血者在一个同时接受预约的献血中心献血。原文没有说，没有预约的献血者会不会被接待。","informal":"# Functions\n\n## Receive a donor\n\nThe center receives a donor. Whether a donor who did not book is seen is not stated.\n\n# Data Resources\n\n## Donor visit\n\nThe visit records the donor and the appointment time when one was booked.\n\n# Constraints\n\n## Appointment book\n\nThe center keeps a book of appointments.","informalZh":"# 功能\n\n## 接待献血者\n\n中心接待献血者。没有预约的献血者会不会被接待，原文没有写。\n\n# 数据资源\n\n## 献血到访\n\n到访记录献血者；如果事先有预约，也记录预约时间。\n\n# 约束\n\n## 预约簿\n\n中心保存一本预约簿。","slots":[{"id":"unbooked-donor","en":"Is a donor who did not book an appointment seen at the center?","zh":"没有预约的献血者，中心会不会接待？"}]}];

  }
  if (text.includes("；")) return { error: "请用英文分号 ; 隔开，不要用中文分号。" };
  if (text.includes(",") || text.includes("，")) return { error: "不要用逗号。多个编号用英文分号 ; 隔开。" };
  if (text.split(";").some((part) => !trim(part))) return { error: "分号旁边有空的编号。" };

  for (const part of text.split(";").map(trim)) {

function findField(err) {
  const fields = document.querySelectorAll(".field");
  return Array.from(fields).find((field) => {
    const input = field.querySelector("[data-field]");
    if (!input || input.dataset.field !== err.field) return false;
    if (err.extraIndex !== null && err.extraIndex !== undefined) return input.dataset.extra === String(err.extraIndex);
    if (err.slotId) return input.dataset.slot === err.slotId;
    return input.dataset.scope === "scenario";
  });
}
function targetSlot(el) {
  const sc = pack();

}
function onField(event) {

  const slot = targetSlot(el);
  if (!slot) return;
  slot[el.dataset.field] = el.value;
  if (el.dataset.field === "kind" && el.dataset.scope === "scenario" && el.value !== "maintenance") {
    slot.maintenance_affected_ids = "";

  }
  if (el.dataset.field === "kind") {
    const show = el.value === "maintenance";
    document.getElementById("maint-fields").hidden = !show;
    document.getElementById("maint-skip").hidden = show;
  }
  persistLocal();
  if (state.forceErrors && state.view === "scenario") paintErrors(validateScenario(current()));
}

async function bindDirectory() {
  if (!window.showDirectoryPicker) {
    toast("直接双击打开时，浏览器不能绑定文件夹。请用「保存并下载」和「导出并锁定」。");
    return;
  }
  try {
    state.dirHandle = await window.showDirectoryPicker({ mode: "readwrite", id: "study-a-annotator" });
    await storeDirHandle(state.dirHandle);
    await writeDir(state.locked ? "locked" : "draft");
    toast("已绑定。之后每次修改都会覆盖写入 JSON 和 CSV。");
  } catch (err) {
    if (err && err.name !== "AbortError") toast("没有获得文件夹权限。");
  }
}
function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("study-a-annotator", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function storeDirHandle(handle) {
  const db = await idb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(handle, "dir");
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
function applyImport(data) {
  const letter = data.annotator === "B" ? "B" : data.annotator === "A" ? "A" : null;
  if (!letter || !Array.isArray(data.rows)) {
    toast("这个 JSON 不是本页导出的标注文件。");
    return;
  }
  state.annotator = letter;
  state.answers = blankAnswers();
  data.rows.forEach((row) => {
    const sc = SCENARIOS.find((item) => item.id === row.scenario_id);
    if (!sc || typeof row !== "object") return;
    if (row.row_type === "scenario" && !trim(row.slot_id)) {
      const scenario = state.answers[sc.id].scenario;
      ["kind", "keep_unit", "invites_repeated_clarification", "maintenance_affected_ids", "maintenance_unaffected_ids", "notes"].forEach((key) => {
        if (typeof row[key] === "string") scenario[key] = row[key];
      });
      return;
    }
    if (row.row_type !== "slot") return;
    const slotId = trim(row.slot_id);
    const preset = state.answers[sc.id].slots[slotId];
    const target = preset || emptySlot();
    if (!preset) target.slot_id = slotId;
    ["keep_unit", "interpretation_1", "interpretation_2", "interpretations_meaningfully_different", "clarification_target", "must_not_confirm_element_ids", "notes"].forEach((key) => {
      if (typeof row[key] === "string") target[key] = row[key];
    });
    if (!preset) state.answers[sc.id].extra.push(target);
  });
  state.locked = data.status === "locked";
  state.lockedAt = state.locked ? (data.lockedAt || new Date().toISOString()) : null;
  state.index = 0;
  state.view = "scenario";
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  renderNav();
  persistLocal();
  renderMain();
  toast("已导入标注员 " + letter + " 的文件。");
}
function readImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try { applyImport(JSON.parse(String(reader.result))); }
    catch (err) { toast("JSON 读不出来。"); }
  };
  reader.readAsText(file);
}
function start(letter) {
  state.annotator = letter;
  try { localStorage.setItem("study-a-annotator-last", letter); } catch (err) {}
  const saved = readStore(letter);
  state.answers = normalizeAnswers(saved && saved.answers);
  state.locked = !!(saved && saved.locked);
  state.lockedAt = saved && saved.lockedAt || null;
  state.lastSavedAt = saved && saved.updatedAt || null;
  const hash = location.hash.replace("#", "");
  const hashed = SCENARIOS.findIndex((sc) => sc.id === hash);
  state.index = hashed >= 0 ? hashed : Math.min(saved && saved.index || 0, SCENARIOS.length - 1);
  state.view = "scenario";
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("bind-btn").hidden = !window.showDirectoryPicker;
  renderNav();
  renderMain();
}

  }
  if (action === "fill-none") fillNone(actionEl);
  if (action === "prev" && state.index > 0) gotoScenario(SCENARIOS[state.index - 1].id);
  if (action === "next" && state.index < SCENARIOS.length - 1) gotoScenario(SCENARIOS[state.index + 1].id);
  if (action === "check") {
    state.forceErrors = true;
    const errors = validateScenario(current());
    paintErrors(errors);
    if (!errors.length) toast(current().id + " 已填完整。");
    else document.querySelector(".field.invalid")?.scrollIntoView({ behavior: "smooth", block: "center" });
  }
});
document.getElementById("nav").addEventListener("click", (event) => {
  const goto = event.target.closest("[data-goto]");
  if (goto) gotoScenario(goto.dataset.goto);
});
document.getElementById("overview-btn").onclick = () => {
  state.view = state.view === "overview" ? "scenario" : "overview";
  renderMain();
};
document.getElementById("save-btn").onclick = saveDraft;
document.getElementById("lock-btn").onclick = requestLock;
document.getElementById("bind-btn").onclick = bindDirectory;
document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
    event.preventDefault();
    saveDraft();
  }
  if (event.key === "Escape") closeModal();
});
document.querySelector(".brand").insertAdjacentHTML("beforeend", '<button type="button" class="btn ghost small" id="switch-btn">换人</button>');
document.getElementById("switch-btn").onclick = () => {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("gate").classList.remove("hidden");
  refreshGateStats();
};
const fileBar = document.createElement("div");
fileBar.id = "file-bar";
fileBar.innerHTML = '<span>每次修改都会写入这台浏览器，并更新下面两个文件。点文件名即可下载。交回请用「导出并锁定」。</span><div id="live-downloads"></div>';
document.querySelector("header").insertAdjacentElement("afterend", fileBar);

if (SCENARIOS.length !== 15 || SCENARIOS.reduce((sum, sc) => sum + sc.slots.length, 0) !== 13) {
  document.body.innerHTML = "<p>题目数据不完整，请不要使用这个文件。</p>";
}
refreshGateStats();
try {
  const last = localStorage.getItem("study-a-annotator-last");
  if ((last === "A" || last === "B") && readStore(last)) start(last);
} catch (err) {}
  </script>
</body>
